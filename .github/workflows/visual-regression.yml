name: Webview Visual Regression

on:
    workflow_dispatch:
    pull_request:
        types: [opened, reopened, ready_for_review, synchronize]
        paths:
            - "webview-ui/**"
            - "src/shared/**"
            - "package.json"
            - "pnpm-lock.yaml"
            - ".github/workflows/visual-regression.yml"
    merge_group:
        types: [checks_requested]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    webview-visual:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        container:
            image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
            options: --ipc=host
        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
              with:
                  install-args: "--frozen-lockfile"
            - name: Run webview visual tests
              run: pnpm --filter @roo-code/vscode-webview test:visual
            - name: Upload visual test coverage to Codecov
              if: always()
              uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
              with:
                  files: webview-ui/coverage-ct/lcov.info
                  disable_search: true
                  flags: webview-ui-ct
                  token: ${{ secrets.CODECOV_TOKEN }}
            - name: Upload visual test artifacts
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: webview-visual-regression
                  path: |
                      webview-ui/playwright-report
                      webview-ui/test-results
                  if-no-files-found: ignore
